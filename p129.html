<head>
<script>
function validation() {
    let res = document.myForm.date.value;

    if (res == "")
        alert("Please enter date");
    else
        alert("Valid date");
}
</script>
</head>

<body>

<form name="myForm" onsubmit="validation()">
    Date: <input type="date" name="date">
    <input type="submit" value="Click Here">
</form>

</body>

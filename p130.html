<head>
<script>
function validation() {
    let res = document.myForm.name.value;

    if (res == "")
        alert("Please enter name");
    else
        alert("Valid name");
}
</script>
</head>

<body>

<form name="myForm" onsubmit="validation()">
    Name: <input type="text" name="name">
    <input type="submit" value="Click Here">
</form>

</body>

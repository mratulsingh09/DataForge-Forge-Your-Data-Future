<head>
<script>
function validation() {
    let res = document.myForm.phone.value;

    if (res.length != 10)
        alert("Phone number must be 10 digits");
    else
        alert("Valid phone number");
}
</script>
</head>

<body>

<form name="myForm" onsubmit="validation()">
    Phone No: <input type="text" name="phone">
    <input type="submit" value="Click Here">
</form>

</body>
